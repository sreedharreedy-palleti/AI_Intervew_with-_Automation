# ========================================================
# AI Interview Platform - Backend Kubernetes Specification
# Highly Available & High-Concurrency Auto-Scaling Architecture
# Scales dynamically based on live candidate interview & exam load
# Apply with: kubectl apply -f Backend/k8s.yaml
# ========================================================

apiVersion: v1
kind: Namespace
metadata:
  name: ai-interview
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ai-interview
  labels:
    app: ai-interview-backend
data:
  PROJECT_NAME: "AI Interview Platform"
  API_V1_STR: "/api/v1"
  PORT: "8000"
  DATABASE_NAME: "interview_db"
  CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAILS_FROM_NAME: "AI Interview Platform"
  BACKEND_URL: "http://backend-service:8000"
  FRONTEND_URL: "http://frontend-service:80"
  REQUIRE_APP_FOR_EXAM: "False"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ai-interview
  labels:
    app: ai-interview-backend
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://rnani7046_db_user:yP12QMpKzf1iOzEe@cluster0.g38ahsr.mongodb.net"
  JWT_SECRET_KEY: "fe013904d35cff52404de4fdc8d2eb436d22a64326c82fcbe740123c0fa29c3a"
  SMTP_USER: "rnani7046@gmail.com"
  SMTP_PASSWORD: "cqxa zaam jkkd xwhb"
  GEMINI_API_KEY: ""
  GROQ_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: ai-interview
  labels:
    app: ai-interview-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-interview-backend
  template:
    metadata:
      labels:
        app: ai-interview-backend
    spec:
      containers:
        - name: backend
          image: ai-interview-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2500Mi"
          startupProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: temp-storage
              mountPath: /app/static/downloads
              subPath: downloads
            - name: temp-storage
              mountPath: /app/uploads
              subPath: uploads
      volumes:
        - name: temp-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-interview
  labels:
    app: ai-interview-backend
spec:
  type: ClusterIP
  selector:
    app: ai-interview-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: ai-interview
  labels:
    app: ai-interview-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: ai-interview
  labels:
    app: ai-interview-backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ai-interview-backend
