# ========================================================
# AI Interview Platform - Backend Kubernetes Specification
# Contains: Namespace, ConfigMap, Secret, PVC, Deployment, Service, HPA
# Apply with: kubectl apply -f Backend/k8s.yaml
# ========================================================

apiVersion: v1
kind: Namespace
metadata:
  name: ai-interview
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ai-interview
  labels:
    app: ai-interview-backend
data:
  PROJECT_NAME: "AI Interview Platform"
  API_V1_STR: "/api/v1"
  PORT: "8000"
  DATABASE_NAME: "ai_interview_db"
  CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAILS_FROM_NAME: "AI Interview Platform"
  BACKEND_URL: "http://backend-service:8000"
  FRONTEND_URL: "http://frontend-service:80"
  REQUIRE_APP_FOR_EXAM: "False"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ai-interview
  labels:
    app: ai-interview-backend
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://user:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  JWT_SECRET_KEY: "change-this-to-a-very-secure-jwt-secret-key"
  SMTP_USER: "your-email@example.com"
  SMTP_PASSWORD: "your-email-app-password"
  GEMINI_API_KEY: "AIzaSyYourGeminiApiKeyHere"
  GROQ_API_KEY: "gsk_YourGroqApiKeyHere"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-storage-pvc
  namespace: ai-interview
  labels:
    app: ai-interview-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: ai-interview
  labels:
    app: ai-interview-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-interview-backend
  template:
    metadata:
      labels:
        app: ai-interview-backend
    spec:
      containers:
        - name: backend
          image: ai-interview-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: storage-volume
              mountPath: /app/static/downloads
              subPath: downloads
            - name: storage-volume
              mountPath: /app/uploads
              subPath: uploads
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: backend-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-interview
  labels:
    app: ai-interview-backend
spec:
  type: ClusterIP
  selector:
    app: ai-interview-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: ai-interview
  labels:
    app: ai-interview-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

