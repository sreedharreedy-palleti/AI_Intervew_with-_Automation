# ========================================================
# AI Interview Platform - Backend CI/CD Pipeline
# ========================================================

name: Backend CI/CD

on:
  push:
    paths:
      - "Backend/**"
    branches: [ "main", "master", "sreedhar_v2" ]
  pull_request:
    paths:
      - "Backend/**"
    branches: [ "main", "master", "sreedhar_v2" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r Backend/requirements.txt
      - name: Syntax & Integrity Validation
        run: python -m compileall Backend/

  docker-build:
    name: Build Backend Container
    runs-on: ubuntu-latest
    needs: [test-and-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: ai-interview-backend:latest

  k8s-deploy:
    name: Deploy Backend to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Apply Backend Kubernetes Manifest
        run: kubectl apply -f Backend/k8s.yaml
