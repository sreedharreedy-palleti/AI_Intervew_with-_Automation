name: Full Stack CI/CD

on:
  push:
    branches: [ "main", "master", "sreedhar_v2" ]
  pull_request:
    branches: [ "main", "master", "sreedhar_v2" ]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: |
          pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r Backend/requirements.txt
      - run: python -m compileall Backend/

  frontend-build:
    name: Frontend CI (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: "http://localhost:8000"

  docker-and-k8s-validate:
    name: Docker & K8s Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: ai-interview-backend:latest
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: false
          tags: ai-interview-frontend:latest
      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f Backend/k8s.yaml
          kubectl apply --dry-run=client -f Frontend/k8s.yaml

