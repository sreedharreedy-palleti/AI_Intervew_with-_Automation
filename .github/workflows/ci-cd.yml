name: Full Stack CI/CD

on:
  push:
    branches: [ "main", "master", "sreedhar_v2" ]
  pull_request:
    branches: [ "main", "master", "sreedhar_v2" ]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------
  # 1. Backend CI: Dependencies, Syntax & K8s Manifests
  # ----------------------------------------------------
  backend-test:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r Backend/requirements.txt

      - name: Validate Python Syntax & Bytecode Compilation
        run: python -m compileall Backend/

      - name: Validate Kubernetes Manifests (Backend & Frontend)
        run: |
          python -c "import yaml; [print(f'[OK] {p}: {len(list(yaml.safe_load_all(open(p, encoding=\"utf-8\"))))} manifests verified') for p in ['Backend/k8s.yaml', 'Frontend/k8s.yaml']]"

  # ----------------------------------------------------
  # 2. Frontend CI: Dependencies, Build & K8s Manifests
  # ----------------------------------------------------
  frontend-build:
    name: Frontend CI (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Production Frontend Assets
        env:
          VITE_API_BASE_URL: "http://localhost:8000"
        run: npm run build

  # ----------------------------------------------------
  # 3. Docker Validation: Multi-Stage Container Builds
  # ----------------------------------------------------
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: false
          tags: ai-interview-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: ai-interview-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
