# ==========================================
# AI Interview Platform - Docker Compose
# Orchestrates Frontend + Backend Containers
# ==========================================

services:
  # ------------------------------------------
  # Backend API Service (FastAPI + YOLO + Motor)
  # ------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: ai-interview-backend:latest
    container_name: ai_interview_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=8000
    volumes:
      # Persist static uploads and downloads across container restarts
      - backend_uploads:/app/static/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ai_interview_net

  # ------------------------------------------
  # Frontend UI Service (React 19 + Vite + Nginx)
  # ------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    image: ai-interview-frontend:latest
    container_name: ai_interview_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai_interview_net

# ------------------------------------------
# Container Network & Storage Volumes
# ------------------------------------------
networks:
  ai_interview_net:
    driver: bridge

volumes:
  backend_uploads:
    driver: local

